services:
  - type: web
    name: bigbasket-itam-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    disks:
      - name: bigbasket-itam-data
        mountPath: /var/data
        sizeGB: 1
